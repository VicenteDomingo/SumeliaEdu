<span class="badge" [attr.data-status]="status">
  <mat-icon aria-hidden="true">{{ icons[status] }}</mat-icon>
  {{ labels[status] }}
</span>


<!-- [attr.data-status]="status" -> attribute binding, "Attribute binding in Angular helps you set values for attributes directly. With attribute binding, you can improve accessibility, style your application dynamically, and manage multiple CSS classes or styles simultaneously" https://v17.angular.io/guide/attribute-binding  -->
